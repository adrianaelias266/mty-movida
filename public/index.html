<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mty Movida: la agenda cultural de Monterrey. Eventos, planes para hoy y atracciones de la zona metropolitana.">
<link rel="icon" type="image/png" sizes="32x32" href="img/icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mty Movida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Dancing+Script:wght@600;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Layout: cartelera urbana con franja naranja de la marca, carrusel de portada y tarjetas con imagen; naranja quemado y lila de Mty Movida sobre neutros cálidos */
:root{
  --bg:#F7F3F2; --surface:#FFFFFF; --sunk:#F1ECEA; --ink:#1E1714; --muted:#6B605B; --line:#E2DCD8;
  --accent:#BF4718; --accent-soft:#F8E3D9; --on-accent:#FFFFFF;
  --brand:#BF4718; --on-brand:#FFFFFF; --brand-dim:rgba(255,255,255,.8);
  --lila:#7E55D6; --lila-bg:#CBA6FF; --lila-ink:#24123F; --lila-soft:#EFE6FF;
  --green:#0E8580; --green-soft:#D6F4F2; --sun:#B26A00; --sun-soft:#FFF1CC;
  --teal:#1AC1B9; --gold:#FDBD1A; --pink:#F9447F; --pink-soft:#FCB8D9; --blue:#7F95E4; --clem:#FF8017; --tile-ink:#24123F;
  --shadow:0 2px 6px rgba(30,23,20,.05),0 12px 30px rgba(30,23,20,.07);
  --f-display:"Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Plus Jakarta Sans",system-ui,sans-serif;
  --f-script:"Dancing Script","Brush Script MT",cursive;
  --f-wm:"Big Shoulders Display","Bebas Neue","Arial Narrow",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15110F; --surface:#1E1916; --sunk:#29221E; --ink:#F2ECE8; --muted:#A99D96; --line:#382F2A;
  --accent:#EE7A45; --accent-soft:#3A2116; --on-accent:#1A0A04;
  --brand:#B4431A; --lila:#CBA6FF; --lila-soft:#2C2240;
  --green:#4FD6CE; --green-soft:#11302F; --sun:#FDC94A; --sun-soft:#352A0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15110F; --surface:#1E1916; --sunk:#29221E; --ink:#F2ECE8; --muted:#A99D96; --line:#382F2A;
  --accent:#EE7A45; --accent-soft:#3A2116; --on-accent:#1A0A04;
  --brand:#B4431A; --lila:#CBA6FF; --lila-soft:#2C2240;
  --green:#4FD6CE; --green-soft:#11302F; --sun:#FDC94A; --sun-soft:#352A0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}

/* Encabezado naranja */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--on-brand)}
.top :focus-visible{outline-color:var(--on-brand)}
.top-in{display:flex;align-items:center;gap:20px;padding-block:8px}
.brand{display:flex;align-items:center;gap:6px;color:var(--on-brand);flex:none;background:none;border:0;padding:0;text-align:left}
.lockup{display:inline-flex;flex-direction:column;gap:3px}
.lk-row{display:flex;align-items:flex-end;gap:var(--lg-gap,6px)}
.lk-row .logo{width:auto;height:var(--lg-fig,42px);display:block}
.lk-name{transform:translateY(var(--lg-dy,0px));position:relative;display:flex;flex-direction:column;font-family:var(--f-wm);font-weight:800;text-transform:uppercase;line-height:.8;color:var(--on-brand);padding:2px 3px 0}
.lk-name i{font-style:normal;display:inline-block}
.lk-mty{display:flex;font-size:var(--lg-mty,16px);letter-spacing:.06em}
.lk-mty i:nth-child(2){transform:translateY(-1px)}
.lk-mov{display:flex;font-size:var(--lg-mov,27px);letter-spacing:.015em;margin-top:var(--lg-line,1px)}
.lk-mov i:nth-child(1){transform:translateY(1px)}
.lk-mov i:nth-child(2){transform:translateY(-2px);color:var(--lila-bg)}
.lk-mov i:nth-child(3){transform:translateY(1px)}
.lk-mov i:nth-child(4){transform:translateY(-1px) scaleY(1.1)}
.lk-mov i:nth-child(5){transform:translateY(1px)}
.lk-mov i:nth-child(6){transform:translateY(-1px)}
.lk-name .c{position:absolute;width:5px;height:3px;border-radius:1px}
.lk-tag{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:7.5px;font-weight:700;line-height:1;color:var(--brand-dim)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;color:var(--brand-dim);font-weight:600;padding:8px 12px;border-radius:999px;font-size:14px}
.nav a:hover{color:var(--on-brand);background:rgba(255,255,255,.14)}
.nav a[aria-current="page"]{color:var(--lila-ink);background:var(--lila-bg)}
.nav a.hoy{color:var(--lila-bg)}
.nav a.hoy[aria-current="page"]{background:var(--lila-bg);color:var(--lila-ink)}
.user-btn{flex:none;border:0;background:var(--lila-bg);color:var(--lila-ink);border-radius:999px;padding:6px 14px 6px 6px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.user-btn:hover{filter:brightness(1.05)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--lila-ink);color:var(--lila-bg);display:grid;place-items:center;font-size:12px;font-weight:700}
.burger{display:none;flex:none;width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:var(--on-brand);place-items:center;padding:0}
.burger span{display:block;width:20px;height:2px;border-radius:2px;background:currentColor;position:relative;transition:background .2s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:20px;height:2px;border-radius:2px;background:currentColor;transition:transform .2s}
.burger span::before{top:-6px}.burger span::after{top:6px}
.top.menu-open .burger span{background:transparent}
.top.menu-open .burger span::before{transform:translateY(6px) rotate(45deg)}
.top.menu-open .burger span::after{transform:translateY(-6px) rotate(-45deg)}
@media (prefers-reduced-motion:reduce){.burger span,.burger span::before,.burger span::after{transition:none}}
@media (max-width:820px){
  .top-in{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:10px}
  .burger{display:grid;order:1}
  .brand{order:2;justify-self:center}
  .user-btn{order:3;justify-self:end;margin:0;padding:0;width:42px;height:42px;border-radius:50%;justify-content:center;background:var(--lila-bg)}
  .user-btn .ub-t{display:none}
  .user-btn .avatar{width:34px;height:34px;font-size:14px}
  .nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:2px;overflow:visible;background:var(--brand);padding:6px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));box-shadow:0 14px 30px rgba(0,0,0,.25);border-top:1px solid rgba(255,255,255,.18)}
  .top.menu-open .nav{display:flex}
  .nav a{font-size:17px;padding:13px 14px;border-radius:12px}
  .nav a,.nav a.hoy{color:var(--on-brand)}
}


/* Botones y chips */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.lila{background:var(--lila-bg);border-color:var(--lila-bg);color:var(--lila-ink)}
.btn.lila:hover{filter:brightness(1.05)}
.btn.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{padding:6px 12px;font-size:13px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:6px;padding:2px 8px;white-space:nowrap}
.tag.free{background:var(--green-soft);color:var(--green)}
.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.script{font-family:var(--f-script);font-size:clamp(25px,2.8vw,34px);line-height:1;color:var(--accent);font-weight:700;display:block;margin-bottom:6px;letter-spacing:0}

/* Encabezados de página */
.page{padding-block:28px 64px}
.phead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}
.phead h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.2vw,46px);letter-spacing:-.035em;line-height:1.04}
.phead p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:40px 0 14px;flex-wrap:wrap}
.sechead h2{font-family:var(--f-display);font-size:clamp(21px,2.4vw,27px);font-weight:800;letter-spacing:-.025em;line-height:1.15}

/* Inicio: carrusel */
.hero{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/7;max-width:100%;min-height:340px;background:#120c09;color:#fff}
@media (max-width:640px){.hero{aspect-ratio:4/5;min-height:0}}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04);transition:transform 7s ease-out}
.slide.on img{transform:scale(1)}
@media (prefers-reduced-motion:reduce){.slide,.slide img{transition:none}.slide img{transform:none}}
.cap{position:absolute;inset:auto 0 0 0;padding:28px 28px 54px;background:linear-gradient(180deg,rgba(18,12,9,0) 0%,rgba(18,12,9,.55) 40%,rgba(18,12,9,.88) 100%);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.cap .kick{font-family:var(--f-mono);font-size:13px;font-weight:700;letter-spacing:0;background:var(--lila-bg);color:var(--lila-ink);padding:4px 10px;border-radius:999px}
.cap h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.6vw,56px);line-height:.98;letter-spacing:-.025em;max-width:22ch}
.cap p{margin:0;opacity:.88;font-size:15px}
.cap .row .btn:not(.primary){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.hero-ctl{position:absolute;right:20px;bottom:16px;display:flex;align-items:center;gap:8px;z-index:2}
.dots{display:flex;gap:6px;margin-right:6px}
.dots button{width:9px;height:9px;border-radius:99px;border:0;background:rgba(255,255,255,.45);padding:0;transition:width .3s}
.dots button[aria-current="true"]{width:26px;background:#fff}
.hbtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(18,12,9,.35);color:#fff;display:grid;place-items:center}
.hbtn svg{width:16px;height:16px}
.hero-week{position:absolute;left:20px;bottom:18px;z-index:2;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
@media (max-width:640px){.hero-week{display:none}.cap{padding:20px 20px 58px}}

.quick{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:820px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink)}
.qcard:hover{border-color:var(--muted)}
.qcard b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.qcard span{color:var(--muted);font-size:13px}
.qcard.main{background:var(--lila-bg);border-color:var(--lila-bg);color:var(--lila-ink)}
.qcard.main b{font-size:18px}
.qcard.main span{color:var(--lila-ink);opacity:.8}
.cattiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cattile{position:relative;border:0;padding:0;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;max-width:100%;color:#fff;text-align:left}
.cattile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.cattile:hover img{transform:scale(1.05)}
.cattile span{position:absolute;inset:auto 0 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-weight:700;font-size:14px;line-height:1.2}
.cta{margin-top:40px;background:var(--brand);color:var(--on-brand);border-radius:20px;padding:32px;position:relative;overflow:hidden;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.cta>*{position:relative;z-index:1}
.cta h2{font-family:var(--f-display);font-weight:700;letter-spacing:-.03em;font-size:clamp(22px,3vw,32px)}
.cta p{margin:6px 0 0;opacity:.85;max-width:52ch}

/* Portada con bloque de color */
.homehero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;align-items:stretch;margin-bottom:22px}
@media (max-width:820px){.homehero{grid-template-columns:minmax(0,1fr)}}
.homehero .lead{display:flex;flex-direction:column;justify-content:center;gap:14px;padding-block:10px}
.homehero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5vw,60px);letter-spacing:-.035em;line-height:1.02}
.homehero p{margin:0;color:var(--muted);max-width:46ch;font-size:16px}
.blk{position:relative;min-height:340px}
.pz{position:absolute;display:block}
.pz.arch{background:#BF4718;border-radius:999px 999px 28px 28px;overflow:hidden}
.pz.arch{container-type:size}
.figbox{position:absolute;left:50%;bottom:4%;width:min(88%,80cqh);aspect-ratio:1;transform:translateX(-50%);pointer-events:none}
.figbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.figbox{font-family:var(--f-script);font-weight:700;font-size:clamp(13px,5cqi,20px);line-height:1;color:#fff}
.nm{position:absolute;white-space:nowrap;color:#fff}
.nm{transform:translate(-50%,-50%) rotate(-90deg);transform-origin:center}
.nm-l{left:42%;top:64%;transform:translate(-50%,-50%) rotate(55deg)}
.nm-r{left:72%;top:64%;transform:translate(-50%,-50%) rotate(55deg)}

.pz.cerro{aspect-ratio:200/90}
.pz.cerro svg{display:block;width:100%;height:100%}
.pz.half{aspect-ratio:2/1;border-radius:999px 999px 0 0;background:#CBA6FF}
.pz.pill{aspect-ratio:4/1;border-radius:999px;background:#1AC1B9;transform:rotate(-24deg)}
.pz.ring{aspect-ratio:1;border:3px solid #6CC5F0;border-radius:50%}
.pz.dot{aspect-ratio:1;border-radius:50%;background:#F9447F}
.pz.nube,.pz.nube2{aspect-ratio:120/64}
.pz.nube svg,.pz.nube2 svg{display:block;width:100%;height:100%}
.pz.nube2{z-index:2}
.pz.sol{aspect-ratio:1;border-radius:50%;background:#FDBD1A;z-index:2}

.pz.msg{font-family:var(--f-display);font-weight:700;line-height:1.02;letter-spacing:-.02em;color:var(--ink);z-index:3}
.pz.msg i{font-family:var(--f-script);font-style:normal;font-weight:600;font-size:1.5em;display:block;color:var(--accent);line-height:.85;letter-spacing:0}
body.editing .pz{outline:2px dashed var(--lila);outline-offset:3px;cursor:move;touch-action:none}
body.editing .pz.sel{outline:3px solid var(--accent)}
/* Panel de edición */
.edbtn{position:fixed;left:max(16px,calc(env(safe-area-inset-left,0px) + 12px));bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 12px));z-index:40;box-shadow:var(--shadow)}
.edpanel{position:fixed;left:max(16px,calc(env(safe-area-inset-left,0px) + 12px));bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 12px));z-index:45;width:min(330px,calc(100% - 32px));max-height:calc(100vh - 120px);overflow:auto;background:var(--surface);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:16px;display:flex;flex-direction:column;gap:12px}
.edpanel h3{font-size:16px;font-weight:700;font-family:var(--f-display)}
.edpanel .sl{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:2px 8px;align-items:center;font-size:13px}
.edpanel .sl label{grid-column:1/-1;font-weight:600}
.edpanel .sl input{width:100%;accent-color:var(--accent)}
.edpanel .sl output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:12px}
.edpanel .hint{font-size:12px;color:var(--muted);margin:0}
.subhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.subhead h2{font-family:var(--f-display);font-weight:800;font-size:clamp(21px,2.4vw,27px);letter-spacing:-.025em;line-height:1.15}
.subhead span{color:var(--muted);font-size:14px}

/* Planes */
.today-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
.today-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,5.4vw,60px);letter-spacing:-.03em;line-height:.95;margin-top:4px}
.today-head p{margin:10px 0 0;color:var(--muted);max-width:56ch}
.plans3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:960px){.plans3{grid-template-columns:minmax(0,1fr)}}
.pc{background:var(--surface);border:1px solid transparent;box-shadow:var(--shadow);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.pc-main{display:flex;flex-direction:column}
.pc-img{position:relative;aspect-ratio:16/10;max-width:100%;cursor:pointer}

.pc-img img{width:100%;height:100%;object-fit:cover;display:block}
.mood{position:absolute;left:12px;top:12px;background:var(--mc,var(--lila-bg));color:var(--tile-ink);font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px}
.recb{position:absolute;right:12px;bottom:12px;background:var(--pink);color:var(--on-brand);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.pc-body{padding:16px;display:flex;flex-direction:column;gap:7px;min-width:0}
.pc-when{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:0}
.pc:not(.big) h3{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.16em}
.pc:not(.big) .meta{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3em}
.pc:not(.big) .why{white-space:nowrap;overflow:hidden}
.pc:not(.big) .why span{overflow:hidden;text-overflow:ellipsis}
.pc:not(.big) .comp{min-height:62px;display:flex;align-items:center}
.pc .btn{white-space:nowrap}
.pc .row .btn{flex:1;justify-content:center}
.pc .chg{width:100%;justify-content:center;background:var(--lila-soft);border-color:transparent;color:var(--lila)}
.pc .chg:hover{filter:brightness(.97)}
.pc h3{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.03em;line-height:1.08}
.pc .meta{margin:0;color:var(--muted);font-size:14px}
.why{margin:0;font-size:14px;display:flex;gap:6px;align-items:flex-start;color:var(--green);font-weight:600}
.why svg{width:16px;height:16px;flex:none;margin-top:2px}
.comp{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px}
.comp .linkish{font-size:13px}
.pc .row{margin-top:4px}
.pc.big .pc-body{padding:22px}
.pc.big h3{font-size:clamp(24px,3vw,34px)}
@media (min-width:760px){.pc.big .pc-body .catdot{margin-top:0}.pc.big .pc-main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.pc.big .pc-img{aspect-ratio:auto;min-height:100%}}
.alts{border-top:1px solid var(--line);padding:14px 16px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.alt{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border-radius:10px;padding:8px}
.alt img{width:64px;height:48px;object-fit:cover;border-radius:6px;display:block}
.alt b{font-size:14px;display:block;line-height:1.2}
.alt span{font-size:12px;color:var(--muted)}
.wiz{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.wiz{grid-template-columns:minmax(0,1fr)}}
.wiz .panel{gap:18px}
.wiz .chip[aria-pressed="true"]{background:var(--lila-bg);color:var(--lila-ink);border-color:var(--lila-bg);font-weight:700}
.notice{font-size:13px;color:var(--sun);background:var(--sun-soft);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.ob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ob-tile{position:relative;border:0;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:1;max-width:100%;color:#fff;text-align:left;outline:3px solid transparent;outline-offset:2px;transition:outline-color .15s,transform .15s}
.ob-tile img{width:100%;height:100%;object-fit:cover;display:block}
.ob-tile span{position:absolute;inset:auto 0 0 0;padding:24px 10px 9px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-weight:700;font-size:13px;line-height:1.2}
.ob-tile i{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid #fff;display:grid;place-items:center}
.ob-tile i svg{width:14px;height:14px;opacity:0}
.ob-tile[aria-pressed="true"]{outline-color:var(--lila-bg);transform:scale(.97)}
.ob-tile[aria-pressed="true"] i{background:var(--lila-bg);border-color:var(--lila-bg);color:var(--lila-ink)}
.ob-tile[aria-pressed="true"] i svg{opacity:1}
.ob-steps{display:flex;gap:6px}.ob-steps b{height:4px;flex:1;border-radius:4px;background:var(--line)}.ob-steps b.on{background:var(--accent)}
.tag.rec-t{background:var(--pink-soft);color:#8A1240}

/* Filas tipo Netflix */
.rowsec{margin-top:30px}
.rowsec .rh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.rowsec h3{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2.2vw,22px);letter-spacing:-.02em}
.rowsec .rh span{color:var(--muted);font-size:13px}
.rwrap{position:relative}
.rscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:2px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;padding:6px 2px 12px;scrollbar-width:none;cursor:grab}
.rscroll.drag{cursor:grabbing;scroll-snap-type:none;user-select:none}
.rscroll.drag .rc{pointer-events:none}
.rc{contain:layout paint}
.rscroll::-webkit-scrollbar{display:none}
.rc{flex:0 0 228px;scroll-snap-align:start;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;display:flex;flex-direction:column}
.rc:hover,.rc:focus-within{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 34px rgba(30,23,20,.16)}
@media (prefers-reduced-motion:reduce){.rc,.rc:hover{transition:none;transform:none}}
@media (hover:none){.rc:hover,.rc:focus-within{transform:none;box-shadow:var(--shadow)}}
.rc-img{position:relative;aspect-ratio:16/10;max-width:100%}
.rc-img img{width:100%;height:100%;object-fit:cover;display:block}
.rc-img .ev-hr{right:8px;bottom:8px}
.rc-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rc-b .catdot{width:32px;height:32px;margin-top:-26px;position:relative;z-index:2}
.rc-b .catdot svg{width:16px;height:16px}
.rc-b b{font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.rc-b small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .qa{display:flex;gap:6px;max-height:0;opacity:0;overflow:hidden;transition:max-height .2s,opacity .2s,margin .2s}
.rc:hover .qa,.rc:focus-within .qa{max-height:40px;opacity:1;margin-top:6px}
.rc .qa .btn{padding:5px 10px;font-size:12px;flex:1;justify-content:center}
@media (hover:none){.rc .qa{display:none}}
.rtop{flex:0 0 auto;display:flex;align-items:flex-end;scroll-snap-align:start}
.rtop .n{font-family:var(--f-display);font-weight:800;font-size:110px;line-height:.78;color:transparent;-webkit-text-stroke:3px var(--accent);margin-right:-16px;position:relative;z-index:0;letter-spacing:-.06em}
.rtop .rc{flex-basis:200px;position:relative;z-index:1}
.rarrow{position:absolute;top:38%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;z-index:3}
.rarrow svg{width:18px;height:18px}
.rarrow.l{left:-12px}.rarrow.r{right:-12px}
@media (hover:none),(max-width:700px){.rarrow{display:none}}
.allbtn{display:flex;justify-content:center;margin-top:28px}

/* Eventos */
.evlayout{display:grid;grid-template-columns:268px minmax(0,1fr);gap:28px;align-items:start}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.fgroup h4{margin:0 0 8px;font-size:12px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
select.inp,input.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
textarea.inp{resize:vertical;min-height:90px}
.ftoggle{display:none}
@media (max-width:900px){
  .evlayout{grid-template-columns:minmax(0,1fr)}
  .filters{position:static;max-height:none;overflow:visible;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .filters[data-fopen="false"]{display:none}
  .ftoggle{display:inline-flex}
}
.resbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px}
.resbar .count{font-weight:600}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.active-filters .chip{background:var(--lila-soft);border-color:transparent;color:var(--lila)}

.daygroup{margin-bottom:28px}
.daygroup>h2{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.daygroup>h2 span{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ev{display:flex;flex-direction:column;background:var(--surface);border:1px solid transparent;box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s}
.ev:hover{border-color:var(--muted);box-shadow:var(--shadow)}
.ev-img{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--sunk)}
.ev-img img{width:100%;height:100%;object-fit:cover;display:block}
.ev-date{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 9px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.05;font-family:var(--f-mono);font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.ev-date .dow{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.ev-date .num{font-family:var(--f-display);font-weight:700;font-size:20px}
.ev-date .mon{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--accent)}
.ev-hr{position:absolute;right:10px;bottom:10px;background:rgba(18,12,9,.72);color:#fff;font-family:var(--f-mono);font-weight:700;font-size:12px;border-radius:6px;padding:2px 8px}
.savebtn{position:absolute;right:8px;top:8px;border:0;background:var(--surface);color:var(--muted);padding:7px;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.savebtn svg{width:18px;height:18px}
.savebtn[aria-pressed="true"]{color:var(--accent)}
.catdot{width:38px;height:38px;border-radius:50%;background:var(--cc);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 4px var(--surface)}
.catdot svg{width:20px;height:20px}
.catdot.big{width:46px;height:46px}.catdot.big svg{width:22px;height:22px}
.ev-body .catdot,.pc-body .catdot{margin-top:-33px;margin-bottom:2px;position:relative;z-index:2}
.ev-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ev-cat{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.ev-cat i{width:8px;height:8px;border-radius:50%}
.ev h3{font-size:16px;font-weight:700;line-height:1.25}
.ev-meta{margin:0;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:6px}
.ev .rating{font-size:12px;font-weight:600;color:var(--sun);display:flex;gap:4px;align-items:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}


/* ¿Qué plan? */
.hoycard h1 .dia{font-family:var(--f-script);font-weight:700;color:var(--lila-bg);font-size:1.15em;letter-spacing:0;line-height:.9;margin-left:.18em;margin-right:.06em}
.daytabs{display:flex;flex-wrap:wrap;gap:6px;position:relative}
.daytabs button{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;background:rgba(255,255,255,.16);color:var(--on-brand)}
.daytabs button:hover{background:rgba(255,255,255,.26)}
.daytabs button[aria-pressed="true"]{background:var(--lila-bg);color:var(--lila-ink)}
a.stat{text-decoration:none}
.stat b svg{width:34px;height:34px}
.h2plan{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3vw,34px);letter-spacing:-.03em;line-height:1.08}
#plan-armado{scroll-margin-top:80px}
/* Inicio en celular: los 3 planes caben en una pantalla */
@media (max-width:640px){
  .plans3{gap:10px}
  .plans3 .pc{border-radius:16px}
  .plans3 .pc-main{display:grid;grid-template-columns:96px minmax(0,1fr)}
  .plans3 .pc-img{aspect-ratio:auto;height:100%;min-height:118px}
  .plans3 .mood{left:6px;top:6px;font-size:11px;padding:3px 8px;white-space:nowrap;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis}
  .plans3 .recb,.plans3 .pc-body .catdot,.plans3 .pc .why,.plans3 .pc .comp{display:none}
  .plans3 .pc-body{padding:10px 12px;gap:2px}
  .plans3 .pc-when{font-size:12px}
  .plans3 .pc h3{font-size:16px;line-height:1.15;min-height:0}
  .plans3 .pc .meta{-webkit-line-clamp:1;min-height:0;font-size:13px}
  .plans3 .pc .row{margin-top:6px;gap:6px}
  .plans3 .pc .btn.small{padding:6px 10px;font-size:13px;gap:5px}
  .plans3 .pc .chg{margin-top:6px}
  .plans3 .alts{padding:10px}
}


/* Tarjetas de evento compactas (foto a un lado) */
.evgrid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media (max-width:640px){.evgrid{grid-template-columns:minmax(0,1fr);gap:10px}}
.ev{display:grid;grid-template-columns:112px minmax(0,1fr);border-radius:16px}
.ev-img{aspect-ratio:auto;height:100%;min-height:126px}
.ev-cattag{position:absolute;left:6px;top:6px;background:var(--cc);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .savebtn{top:auto;bottom:6px;right:6px;padding:6px}
.ev .savebtn svg{width:16px;height:16px}
.ev-body{padding:10px 12px;gap:2px}
.ev-when{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--accent)}
.ev-when .free-t{color:var(--green)}
.ev h3{font-size:16px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev-tags{padding-top:4px}


/* Calendario: franja de días + línea de tiempo */
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border-radius:20px;padding:8px;box-shadow:var(--shadow);margin-bottom:18px}
.wsd{border:0;background:none;border-radius:14px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:13px;font-weight:600;transition:background .2s}
.wsd b{font-family:var(--f-display);font-size:20px;color:var(--ink);line-height:1.2}
.wsd.today b{color:var(--accent)}
.wsd.past{opacity:.55}
.wsd:hover{background:var(--sunk)}
.wsd[aria-pressed="true"]{background:var(--lila-bg);color:var(--lila-ink);opacity:1}
.wsd[aria-pressed="true"] b{color:var(--lila-ink)}
.wsd .dots{display:flex;gap:3px;height:6px}
.wsd .dots i{width:6px;height:6px;border-radius:50%}
.tl{position:relative;padding-left:30px;display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.tl::before{content:"";position:absolute;left:10px;top:10px;bottom:16px;width:2px;border-radius:2px;background:var(--line)}
.tl-day{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);scroll-margin-top:90px}
.tl-day:first-child{margin-top:0}
.tl-day::before{content:"";position:absolute;left:-26px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--bg);border:2px solid var(--muted)}
.tl-day.on{color:var(--lila)}
.tl-day.on::before{background:var(--lila);border-color:var(--lila);box-shadow:0 0 0 4px var(--lila-soft)}
.tl-day .linkish{font-size:13px;text-transform:none;letter-spacing:0}
.tl-it{position:relative;border:0;text-align:left;border-radius:18px;padding:14px 16px;background:color-mix(in srgb,var(--c) 20%,var(--surface));color:var(--ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:baseline;transition:background .25s,color .25s,box-shadow .25s}
.tl-it:hover{background:color-mix(in srgb,var(--c) 30%,var(--surface))}
.tl-it b{font-family:var(--f-display);font-size:16px;font-weight:700;line-height:1.25}
.tl-it .t{font-weight:700;font-size:14px;white-space:nowrap}
.tl-it small{grid-column:1/-1;color:var(--muted);font-size:13px}
.tl-it.past{opacity:.6}
.tl-it.on{background:var(--c);color:var(--ci);box-shadow:0 10px 24px color-mix(in srgb,var(--c) 35%,transparent)}
.tl-it.on small{color:inherit;opacity:.85}
.tl-empty{background:var(--surface);border-radius:16px;padding:18px;color:var(--muted);margin-bottom:24px}
.mcal{background:var(--surface);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.mcal .mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.mcgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mc{position:relative;justify-self:center;width:min(46px,100%);aspect-ratio:1;border:0;border-radius:50%;background:var(--sunk);color:var(--ink);font-weight:700;font-size:15px;display:grid;place-items:center;transition:background .2s,transform .2s}
.mc.out{opacity:.35}
.mc.today{box-shadow:inset 0 0 0 2px var(--accent)}
.mc.has{background:color-mix(in srgb,var(--c) 35%,var(--surface))}
.mc i{position:absolute;right:-2px;top:-2px;min-width:17px;height:17px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:10px;font-style:normal;display:grid;place-items:center;padding:0 4px}
.mc[aria-pressed="true"]{background:var(--lila-bg);color:var(--lila-ink);transform:scale(1.08)}
.mc.has[aria-pressed="true"]{background:var(--c);color:var(--ci)}
.mleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--muted)}
.mleg span{display:flex;align-items:center;gap:6px}
.mleg i{width:10px;height:10px;border-radius:50%}
@media (prefers-reduced-motion:reduce){.tl-it,.mc,.wsd{transition:none}.mc[aria-pressed="true"]{transform:none}}


.dayinp input{border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;background:var(--surface);color:var(--ink);font-family:var(--f-body)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.fgroup h4 .opt{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:12px;margin-left:6px}
.wiz .chip i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}

.gcalrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 28px}
.gcalrow span{font-size:13px;color:var(--muted)}
.logoutrow{display:flex;justify-content:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}


/* Día completo */
.seg.modo{display:inline-flex}
.hint{margin:6px 0 0;font-size:13px;color:var(--muted)}
.itin{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:20px}
.itin-h h3{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,2.6vw,28px);letter-spacing:-.025em;margin:2px 0 4px}
.itin-h p{margin:0 0 16px;color:var(--muted);font-size:14px}
.itin-tl{margin-bottom:16px}
.itin-tl .tl-day::before{display:none}
.it-stop{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;border-radius:18px;padding:10px;background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.it-stop::before{content:"";position:absolute;left:-26px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.it-stop img{width:96px;height:100%;min-height:96px;object-fit:cover;border-radius:12px;cursor:pointer;display:block}
.it-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.it-b b{font-family:var(--f-display);font-size:16px;line-height:1.2}
.it-b small{color:var(--muted);font-size:13px}
.it-b .row{margin-top:6px;gap:6px;flex-wrap:wrap}
.it-b .btn.small{padding:5px 10px;font-size:13px}

/* Calendario */

.dhead{display:flex;flex-direction:column;gap:8px}

function card(e){
  const d=dOf(e.off), c=CATS[e.cat], s=isSaved(e.id);
  const cuando=e.range&&e.off===0?(e.season?'En temporada':e.range):e.off===0?'Hoy':e.off===1?'Mañana':`${DOW[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`;
  const tags=[...(e.src?[`<span class="tag" style="background:var(--accent-soft);color:var(--accent)">${e.src}</span>`]:[]),...(e.rec&&e.off>=0?['<span class="tag rec-t">Recomendado</span>']:[]),`<span class="tag">${e.mod==='linea'?'En línea':e.amb==='exterior'?'Exterior':'Interior'}</span>`];
  let extra='';
  if(e.off<0){ const r=reviewsOf(e.id), a=avgOf(r); extra = a?`<span class="rating">${I.star.replace('<svg','<svg width="13" height="13"')} ${a.toFixed(1)} · ${r.length} reseñas</span>`:''; }
  return `<article class="ev" data-open="${e.id}" tabindex="0">
    <div class="ev-img"><img src="${evImg(e)}" alt=""${fitAttr(e)} loading="lazy" decoding="async"><span class="ev-cattag" style="--cc:${c.c}">${c.n}</span>
    ${e.off>=0?`<button class="savebtn" data-save="${e.id}" aria-pressed="${s}" aria-label="${s?'Quitar de':'Agregar a'} Mi calendario">${s?I.bmf:I.bm}</button>`:''}</div>
    <div class="ev-body"><span class="ev-when">${cuando} · ${hh(e)} · <span class="${e.price===0?'free-t':''}">${priceTxt(e.price)}</span></span><h3>${esc(e.t)}</h3><p class="ev-meta">${esc(e.venue)}${e.mod==='linea'?'':' · '+ZONAS[e.zona].n}</p>${extra}<div class="ev-tags">${tags.join('')}</div></div>
  </article>`;
}

function bindPieces(){

    el.addEventListener('pointerdown',ev=>{ if(!EDIT) return; ev.preventDefault(); const k=el.dataset.pz; if(SEL!==k){ SEL=k; renderEd(); }
      const r=box.getBoundingClientRect(), p=LAY.pz[k], sx=ev.clientX, sy=ev.clientY, ox=p.x, oy=p.y; el.setPointerCapture(ev.pointerId);
      const mv=e=>{ p.x=Math.round((ox+(e.clientX-sx)/r.width*100)*10)/10; p.y=Math.round((oy+(e.clientY-sy)/r.height*100)*10)/10; updPiece(k); };

const upc=(a,b)=>EVENTS.filter(e=>e.off>=a&&e.off<=b);
function buildRows(){

  rows.push({t:'Gratis este fin de semana',s:'Sin gastar',items:upc(0,6).filter(e=>e.price===0&&[0,5,6].includes(dOf(e.off).getDay()))});
  const z=used&&S.prefZonas[0]?S.prefZonas[0]:'centro';
  rows.push({t:`Cerca de ti: ${ZONAS[z].n}`,s:used&&S.prefZonas[0]?'Según tu zona':'Elige tu zona en tus gustos',items:upc(0,MAXOFF).filter(e=>e.zona===z&&e.mod!=='linea')});
  rows.push({t:'Para ir en pareja',s:'Planes para una cita',items:upc(0,14).filter(e=>conFit(e,'pareja')===2)});

function bindRows(){
  document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{ const el=document.getElementById('rs'+b.dataset.rs); el.scrollBy({left:+b.dataset.dir*el.clientWidth*.85,behavior:'smooth'}); });
  // Con el mouse: arrastrar y soltar con impulso (en el celular se usa el deslizamiento natural)
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.rscroll').forEach(el=>{
    let down=false, moved=false, x0=0, s0=0, lastX=0, lastT=0, v=0, raf=0;
    el.addEventListener('pointerdown',ev=>{ if(ev.pointerType!=='mouse'||ev.button!==0) return; cancelAnimationFrame(raf); down=true; moved=false; x0=lastX=ev.clientX; s0=el.scrollLeft; lastT=performance.now(); v=0; try{ el.setPointerCapture(ev.pointerId); }catch(e){} });
    el.addEventListener('pointermove',ev=>{ if(!down) return; const dx=ev.clientX-x0; if(!moved&&Math.abs(dx)>5){ moved=true; el.classList.add('drag'); }
      if(moved){ el.scrollLeft=s0-dx; const t=performance.now(); v=(ev.clientX-lastX)/Math.max(1,t-lastT); lastX=ev.clientX; lastT=t; } });
    const up=()=>{ if(!down) return; down=false; if(!moved) return;
      const fin=()=>setTimeout(()=>el.classList.remove('drag'),0);
      if(reduce) return fin(); let vel=-v*16;
      const step=()=>{ vel*=0.94; el.scrollLeft+=vel; if(Math.abs(vel)>0.4) raf=requestAnimationFrame(step); else fin(); };
      raf=requestAnimationFrame(step); };
    el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
    el.addEventListener('click',ev=>{ if(moved){ ev.stopPropagation(); ev.preventDefault(); moved=false; } },true);
  });
}

/* ---------- Día completo: varias paradas en un mismo día (ideal para una cita) ---------- */
const MOM_ORD=['manana','tarde','noche'], MOM_COL={manana:'#FDBD1A',tarde:'#1AC1B9',noche:'#CBA6FF'};
let CP={key:null,off:null,pick:{},skip:{}};
function diasDelPeriodo(){ const c=PA.cuando;
  if(c==='hoy') return [0]; if(c==='manana') return [1]; if(c==='fecha') return [PA.foff??2];
  return [...Array(7).keys()].filter(o=>{ const d=dOf(o).getDay(); return c==='finde'?(d===0||d===6||d===5):true; }); }
function opcionesParada(off,m,ctx,usados){
  const base=EVENTS.filter(e=>e.off===off&&!e.range&&momentoOf(e.h)===m&&!usados.includes(e.id)
    &&!(ctx.presu==='gratis'&&e.price!==0)&&!(ctx.presu==='p200'&&(e.price==null||e.price>200))&&conFit(e,ctx.con)>=0
    &&!(ctx.zonas&&ctx.zonas.length&&e.mod!=='linea'&&!ctx.zonas.includes(e.zona)));
  const gusta=e=>ctx.cats&&ctx.cats.length?ctx.cats.includes(e.cat):moodsOf(e).has(ctx.mood);
  return base.map(e=>({e,sc:(gusta(e)?3:0)+conFit(e,ctx.con)*1.5+(e.rec?1:0)+Math.min(e.going,400)/400+(S.user&&S.followCats.includes(e.cat)?1:0)}))
    .sort((a,b)=>b.sc-a.sc).map(x=>x.e);
}
function armarDia(){
  const ctx={...PA}, moms=MOM_ORD.filter(m=>(PA.moms||[]).includes(m));
  const key=JSON.stringify([ctx.cuando,ctx.foff,ctx.mood,ctx.con,ctx.presu,ctx.cats,ctx.zonas,moms]);
  if(CP.key!==key){
    // si es un periodo (fin de semana o semana), se elige el día con más opciones
    let mejor=null;
    for(const o of diasDelPeriodo()){ const n=moms.filter(m=>opcionesParada(o,m,ctx,[]).length).length; if(mejor==null||n>mejor.n) mejor={o,n}; }
    CP={key,off:mejor?mejor.o:0,pick:{},skip:{}};
  }
  const usados=[], paradas=[];
  for(const m of moms){
    const ops=opcionesParada(CP.off,m,ctx,usados.filter(id=>id!==CP.pick[m]));
    // se evita repetir el mismo tipo de actividad en el día
    const tipos=paradas.map(p=>p.e&&p.e.cat);
    let e=CP.pick[m]?ev(CP.pick[m]):null;
    // de preferencia, en la misma zona que la parada anterior para no cruzar la ciudad
    const zPrev=(paradas.filter(p=>p.e).at(-1)||{}).e?.zona;
    if(!e||!ops.includes(e)) e=ops.find(x=>!tipos.includes(x.cat)&&(!zPrev||x.zona===zPrev))||ops.find(x=>!tipos.includes(x.cat))||ops[0]||null;
    if(e){ CP.pick[m]=e.id; usados.push(e.id); }
    paradas.push({m,e,ops});
  }
  return paradas;
}

}

/* ---------- Filtrado ---------- */
function matchCuando(e){
  const o=e.off, dow=dOf(o).getDay();
  if(o<0||o>MAXOFF) return false;
  switch(F.cuando){
    case 'hoy':return o===0; case 'manana':return o===1;
    case 'finde':return o<=6&&(dow===0||dow===6||(dow===5&&momentoOf(e.h)==='noche'));
    case 'semana':return o<=6;
    case 'quincena':return o<=14;
    case 'fecha':return F.fecha?o===offOfDate(new Date(F.fecha+'T00:00')):true;
    default:return true;
  }
}
function filtered(){
  const q=F.q.trim().toLowerCase();
  return EVENTS.filter(e=>{
    if(!matchCuando(e)) return false;
    if(q && !(e.t+' '+e.venue+' '+ORGS[e.org].n+' '+CATS[e.cat].n).toLowerCase().includes(q)) return false;
    if(F.cats.size && !F.cats.has(e.cat)) return false;
    if(F.mom.size && !F.mom.has(momentoOf(e.h))) return false;
    if(F.amb.size && !F.amb.has(e.amb)) return false;
    if(F.mod.size && !F.mod.has(e.mod)) return false;
    if(F.zona && (e.zona!==F.zona||e.mod==='linea')) return false;
    if(F.precio==='gratis'&&e.price!==0) return false;
    if(F.precio==='paga'&&e.price===0) return false;
    for(const x of F.extras) if(!e.tags.includes(x)) return false;
    return true;
  }).sort((a,b)=>a.off-b.off||a.h.localeCompare(b.h));
}
function activeCount(){ return F.cats.size+F.mom.size+F.amb.size+F.mod.size+F.extras.size+(F.zona?1:0)+(F.precio?1:0)+(F.cuando!=='todo'?1:0)+(F.q?1:0); }

const CUANDO=[['todo','Próximos 30 días'],['hoy','Hoy'],['manana','Mañana'],['finde','Fin de semana'],['semana','Esta semana'],['quincena','Próximos 15 días']];
function viewEventos(){

  if(F.zona) actives.push(['zona',ZONAS[F.zona].n]); if(F.precio) actives.push(['precio',F.precio==='gratis'?'Gratis':'De paga']);

  let results;

  else { const byDay={}; list.forEach(e=>(byDay[e.off]=byDay[e.off]||[]).push(e));
    results=Object.keys(byDay).map(Number).sort((a,b)=>a-b).map(o=>`<section class="daygroup"><h2>${relDay(o)}<span>${o<=1?longDate(o)+' · ':''}${byDay[o].length} ${byDay[o].length===1?'evento':'eventos'}</span></h2><div class="evgrid">${byDay[o].map(card).join('')}</div></section>`).join(''); }
  return `<div class="wrap page">
    <div class="phead"><div><span class="script">Todo lo que pasa</span><h1>Todos los eventos de la ciudad</h1><p>Eventos de hoy y de los próximos 30 días. Filtra por horario, lugar y tipo, y agéndalos en tu calendario.</p></div></div>
    <div class="evlayout">
      <aside class="filters" data-fopen="${F.open}" aria-label="Filtros">
        <div class="search">${I.search}<input id="fq" type="search" placeholder="Buscar evento, lugar u organizador" value="${esc(F.q)}" aria-label="Buscar"></div>
        <div class="fgroup"><h4>Cuándo</h4><div class="chips">${CUANDO.map(c=>`<button class="chip" data-cuando="${c[0]}" aria-pressed="${F.cuando===c[0]}">${c[1]}</button>`).join('')}</div>
          <div style="margin-top:8px"><input class="inp" type="date" id="ffecha" value="${F.fecha}" min="${isoOf(0)}" max="${isoOf(MAXOFF)}" aria-label="Elegir fecha"></div></div>
        <div class="fgroup"><h4>Horario</h4><div class="chips">${Object.entries(MOMENTOS).map(m=>chipSet(F.mom,'mom',m)).join('')}</div></div>
        <div class="fgroup"><h4>Tipo de evento</h4><div class="chips">${Object.entries(CATS).map(([k,c])=>chipSet(F.cats,'cats',[k,c.n],c.c)).join('')}</div></div>
        <div class="fgroup"><h4>Espacio</h4><div class="chips">${chipSet(F.amb,'amb',['interior','Interior'])}${chipSet(F.amb,'amb',['exterior','Exterior'])}</div></div>
        <div class="fgroup"><h4>Modalidad</h4><div class="chips">${chipSet(F.mod,'mod',['presencial','Presencial'])}${chipSet(F.mod,'mod',['linea','En línea'])}</div></div>
        <div class="fgroup"><h4>Municipio</h4><select class="inp" id="fzona" aria-label="Municipio"><option value="">Toda la zona metropolitana</option>${Object.entries(ZONAS).map(([k,z])=>`<option value="${k}" ${F.zona===k?'selected':''}>${z.n}</option>`).join('')}</select></div>
        <div class="fgroup"><h4>Precio</h4><div class="chips"><button class="chip" data-precio="gratis" aria-pressed="${F.precio==='gratis'}">Gratis</button><button class="chip" data-precio="paga" aria-pressed="${F.precio==='paga'}">De paga</button></div></div>
        <div class="fgroup"><h4>Necesito que sea</h4><div class="chips">${Object.entries(EXTRAS).map(x=>chipSet(F.extras,'extras',x)).join('')}</div></div>
      </aside>
      <section style="min-width:0">
        <div class="resbar"><div class="row"><button class="btn small ftoggle" id="ftog">Filtros${activeCount()?` (${activeCount()})`:''}</button><span class="count">${list.length} ${list.length===1?'evento':'eventos'}</span></div>
          <div class="seg" role="group" aria-label="Vista"><button data-vista="lista" aria-pressed="${F.vista==='lista'}">Lista</button><button data-vista="mapa" aria-pressed="${F.vista==='mapa'}">Mapa</button></div></div>

        ${results}
      </section>

function mapSVG(list){
  const counts={}; list.filter(e=>e.mod!=='linea').forEach(e=>counts[e.zona]=(counts[e.zona]||0)+1);
  const online=list.filter(e=>e.mod==='linea').length, mx=Math.max(1,...Object.values(counts));
  let s=`<div class="mapbox"><svg viewBox="0 0 600 420" role="img" aria-label="Mapa de eventos por municipio">
   <path d="M0 420 L0 330 L60 300 L110 330 L170 290 L240 360 L300 330 L330 350 L380 300 L420 340 L470 290 L520 320 L600 300 L600 420 Z" fill="var(--sunk)"/>
   <path d="M430 300 L452 262 L466 276 L486 238 L506 270 L520 300 Z" fill="var(--line)"/>
   <text x="476" y="318" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">Cerro de la Silla</text>
   <text x="120" y="400" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">Sierra Madre</text>
   <path d="M60 150 Q200 200 300 228 T540 256" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 5"/>`;
  for(const [k,z] of Object.entries(ZONAS)){
    const n=counts[k]||0, r=n?14+Math.sqrt(n/mx)*24:7, sel=F.zona===k;
    s+=`<g data-zona="${k}" style="cursor:pointer" tabindex="0" role="button" aria-label="${z.n}: ${n} eventos">
      <circle cx="${z.x}" cy="${z.y}" r="${r}" fill="${n?'var(--accent)':'var(--line)'}" fill-opacity="${n?(sel?1:.85):1}" stroke="${sel?'var(--ink)':'var(--surface)'}" stroke-width="${sel?3:2}"/>
      ${n?`<text x="${z.x}" y="${z.y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--on-accent)" font-family="Plus Jakarta Sans,sans-serif">${n}</text>`:''}
      <text x="${z.x}" y="${z.y+r+15}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" font-family="Plus Jakarta Sans,sans-serif">${z.n}</text></g>`;
  }
  s+=`</svg></div><p class="mapnote">Mapa esquemático. Toca un municipio para ver solo sus eventos.${online?` Además hay ${online} ${online===1?'evento':'eventos'} en línea.`:''}</p>`;
  const sub = F.zona? list.filter(e=>e.zona===F.zona&&e.mod!=='linea') : [];
  if(F.zona) s+=`<h2 style="font-family:var(--f-display);font-size:15px;font-weight:500;margin:18px 0 10px">${ZONAS[F.zona].n}</h2>`+(sub.length?`<div class="evgrid">${sub.map(card).join('')}</div>`:`<div class="empty">Sin eventos en este municipio con los filtros actuales.</div>`);
  return s;
}

  const orgPorNombre=t=>Object.keys(ORGS).find(k=>norm(ORGS[k].n)===norm(t)||norm(ORGS[k].n).startsWith(norm(t))||norm(t).startsWith(norm(ORGS[k].n)));

    if(EVENTS.some(x=>parecido(x.t)&&(x.off===off||x.range))) return;
    if(d.hasta&&/^\d{4}-\d{2}-\d{2}$/.test(d.hasta)){ const end=offOfDate(new Date(d.hasta+'T00:00')); if(off<0&&end>=0) off=0; const h=new Date(d.hasta+'T00:00'); range=`Hasta el ${h.getDate()} de ${MESL[h.getMonth()]}`; }
    const linea=d.municipio==='linea';
    EVENTS.push({id,t:d.nombre,cat:CAT_OK(d.categoria),org:orgKey,venue:d.lugar||(linea?'En línea':'Por confirmar'),zona:ZONAS[d.municipio]?d.municipio:'centro',
      amb:d.espacio==='exterior'?'exterior':'interior',mod:linea?'linea':'presencial',off,h:/^\d{1,2}:\d{2}/.test(d.hora||'')?d.hora.slice(0,5).padStart(5,'0'):'',
      price:typeof d.precio==='number'?d.precio:null,tags:Array.isArray(d.caracteristicas)?d.caracteristicas:[],going:0,desc:d.descripcion||'',range,

  const setMenu=open=>{ top.classList.toggle('menu-open',open); b.setAttribute('aria-expanded',open); b.setAttribute('aria-label',open?'Cerrar menú':'Abrir menú'); };
  b.onclick=e=>{ e.stopPropagation(); setMenu(!top.classList.contains('menu-open')); };
  document.querySelectorAll('#mainNav a').forEach(a=>a.addEventListener('click',()=>setMenu(false)));
  document.addEventListener('click',e=>{ if(top.classList.contains('menu-open')&&!top.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') setMenu(false); });
  window.addEventListener('resize',()=>{ if(window.innerWidth>820) setMenu(false); });
})();
renderUser(); fromHash();
</script>

</body>
</html>
