      <div class="field full"><span class="lbl">Características</span><div class="chips">${Object.entries(EXTRAS).map(([k,n])=>`<label class="chip"><input type="checkbox" name="sExtra" value="${k}"> ${n}</label>`).join('')}</div></div>
      <div class="field full"><label for="sDesc">Descripción *</label><textarea class="inp" id="sDesc" required placeholder="¿De qué trata? ¿Qué incluye? ¿Hay que registrarse?"></textarea></div>
      <div class="field"><label for="sLink">Enlace de boletos o registro</label><input class="inp" id="sLink" type="url" placeholder="https://"></div>
      <div class="field"><label for="sRedes">Redes sociales</label><input class="inp" id="sRedes" placeholder="@tuevento"></div>
      <div class="field full"><label for="sImg">Foto o cartel del evento *</label><input class="inp" id="sImg" type="file" accept="image/*"><span class="hint">JPG o PNG, de preferencia horizontal. Esta foto aparece en la tarjeta y en la portada.</span><img id="sPrev" class="imgprev" alt="Vista previa de la foto" hidden></div>
      <div class="err full" id="sErr" hidden></div>
      <div class="full row" style="flex-direction:column;align-items:flex-start;gap:8px"><button class="btn primary" type="submit">Enviar para revisión</button><span style="font-size:12px;color:var(--muted)">Al enviarlo confirmas que los datos son ciertos y aceptas el <a href="#privacidad">Aviso de privacidad</a> y los <a href="#terminos">Términos de uso</a>.</span></div>
    </form>
    <aside style="display:flex;flex-direction:column;gap:16px">
      <div class="panel"><h3>¿Cómo funciona?</h3><ol class="steps"><li>Envías tu evento con este formulario.</li><li>Lo revisamos en un máximo de 48 horas.</li><li>Te avisamos por correo cuando esté publicado.</li></ol></div>
      <div class="panel"><h3>¿Prefieres escribirnos?</h3><p class="sub">Manda los datos y la foto de tu evento a este correo:</p><div class="copyline"><span>eventos@mtymovida.mx</span><button class="btn small" id="cpMail" type="button">Copiar</button></div></div>
      <div class="panel"><h3>¿Organizas eventos seguido?</h3><p class="sub">Próximamente podrás tener una cuenta de organizador para publicar directamente y ver cuántas personas agendaron tus eventos.</p></div>

function bindAgregar(){

  document.getElementById('cpMail').onclick=()=>copy('eventos@mtymovida.mx','Correo copiado');
  document.getElementById('sImg').onchange=e=>{ const f=e.target.files[0], p=document.getElementById('sPrev'); if(!f){p.hidden=true;return;} const rd=new FileReader(); rd.onload=()=>{ p.src=rd.result; p.hidden=false; }; rd.readAsDataURL(f); };
  document.getElementById('subForm').addEventListener('submit',e=>{ e.preventDefault();
    const req=['sNombre','sOrg','sMail','sCat','sZona','sFecha','sHora','sDesc'], miss=req.filter(id=>!document.getElementById(id).value.trim()), er=document.getElementById('sErr');
    if(miss.length){ er.hidden=false; er.textContent='Faltan campos obligatorios (marcados con *).'; document.getElementById(miss[0]).focus(); return; }
    if(!/^\S+@\S+\.\S+$/.test(document.getElementById('sMail').value)){ er.hidden=false; er.textContent='Revisa el correo de contacto.'; return; }
    if(!document.getElementById('sImg').files.length){ er.hidden=false; er.textContent='Agrega una foto o el cartel del evento.'; return; }
    const v=id=>document.getElementById(id).value.trim(), n=v('sNombre'), btn=document.querySelector('#subForm button[type=submit]');
    if(!sb){ er.hidden=false; er.textContent='No pudimos conectar con el servidor. Revisa tu conexión e intenta de nuevo, o escríbenos al correo de la derecha.'; return; }
    btn.disabled=true; btn.textContent='Enviando…'; er.hidden=true;
    (async()=>{
      try{
        const f=document.getElementById('sImg').files[0], ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
        const path=`${new Date().toISOString().slice(0,10)}/${crypto.randomUUID()}.${ext}`;
        const up=await sb.storage.from('carteles').upload(path,f,{contentType:f.type});
        if(up.error) throw up.error;
        const foto=sb.storage.from('carteles').getPublicUrl(path).data.publicUrl;
        const datos={nombre:n,organizador:v('sOrg'),correo:v('sMail'),categoria:v('sCat'),municipio:v('sZona'),fecha:v('sFecha'),hora:v('sHora'),lugar:v('sLugar'),
          espacio:(document.querySelector('input[name=sAmb]:checked')||{}).value||null,precio:v('sPrecio')===''?null:Number(v('sPrecio')),
          caracteristicas:[...document.querySelectorAll('input[name=sExtra]:checked')].map(c=>c.value),descripcion:v('sDesc'),enlace:v('sLink'),redes:v('sRedes')};
        const ins=await sb.from('eventos_enviados').insert({datos,foto});
        if(ins.error) throw ins.error;
        document.getElementById('subForm').outerHTML=`<div class="panel" style="padding:28px"><span class="eyebrow">Recibido</span><h3 style="font-family:var(--f-display);font-size:22px">Gracias. Recibimos "${esc(n)}".</h3><p style="margin:0;color:var(--muted)">Lo revisaremos y te avisaremos por correo cuando esté publicado.</p><div><button class="btn" id="again">Enviar otro evento</button></div></div>`;
        document.getElementById('again').onclick=render; window.scrollTo({top:0,behavior:'smooth'});
      }catch(x){ console.warn(x); btn.disabled=false; btn.textContent='Enviar para revisión'; er.hidden=false; er.textContent='No pudimos enviar tu evento. Intenta de nuevo en unos minutos.'; }
    })();
  });
}

/* ---------- Ventana ---------- */
const stack=[];
function openModal(html,onMount,cls){ stack.push({html,onMount,cls}); showTop(); }
function showTop(){ const m=document.getElementById('modal'), top=stack[stack.length-1]; document.querySelector('#modal .sheet').className='sheet '+(top.cls||''); document.getElementById('mBody').innerHTML=top.html; document.getElementById('mBack').hidden=stack.length<2; m.hidden=false; document.body.style.overflow='hidden'; if(top.onMount) top.onMount(); bindCommon(document.getElementById('mBody')); m.scrollTop=0; }
function closeModal(){ stack.length=0; document.getElementById('modal').hidden=true; document.body.style.overflow=''; }
function refreshTop(html,onMount){ stack[stack.length-1]={html,onMount}; showTop(); }
document.getElementById('mBack').onclick=()=>{ stack.pop(); showTop(); };
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!document.getElementById('modal').hidden) closeModal(); });

/* ---------- Clima real (pronóstico consultado el 25 de octubre de 2026 para Monterrey) ---------- */
let WX={updated:null,days:{}};
fetch('data/fotos-fijas.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{ if(!d) return; let n=0; [...EVENTS,...Object.values(SES)].forEach(e=>{ const f=d[e.id]; if(f&&!e.img){ e.img=f.foto; e.credit=f.credito; n++; } }); ATR.forEach(a=>{ const f=d['atr:'+a.id]; if(f&&!ATR_FOTO[a.id]){ a.img=f.foto; a.credit=f.credito; n++; } }); if(n&&typeof render==='function') render(); }).catch(()=>{});
fetch('data/fama-fijas.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{ if(!d) return; [...EVENTS,...Object.values(SES)].forEach(e=>{ if(d[e.id]) e.fama=d[e.id]; }); if(typeof render==='function'&&/^#?(inicio)?$/.test(location.hash)) render(); }).catch(()=>{});
fetch('data/clima.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.days){ WX=d; if(typeof render==='function') render(); } }).catch(()=>{});
function fmtUpd(iso){ const d=new Date(iso); return isNaN(d)?'':`el ${d.getDate()} de ${MESL[d.getMonth()]}`; }
function weather(e){
  if(e.mod==='linea'||e.off<0) return '';
  const iso=isoOf(e.off), d=(WX.zonas&&WX.zonas[e.zona]&&WX.zonas[e.zona][iso])||WX.days[iso]; if(!d) return '';
  const [hi,lo,pp]=d, out=e.amb==='exterior', rain=pp>=35, hot=hi>=33;
  const tip = out ? (rain?' Lleva paraguas o impermeable.':hot?' Lleva agua, gorra y bloqueador.':momentoOf(e.h)==='noche'&&lo<=18?' En la noche refresca; lleva algo para abrigarte.':' Buen clima para salir.') : (rain?' Si vas a llegar caminando, lleva paraguas.':'');
  return `<div class="wx ${rain||hot?'warn':'ok'}">${rain?I.rain:I.sun}<span>${out?'Evento al aire libre. ':''}Pronóstico para ese día en ${WX.zonas&&WX.zonas[e.zona]?ZONAS[e.zona].n:'Monterrey'}: entre ${Math.round(lo)} y ${Math.round(hi)} °C, ${pp} % de probabilidad de lluvia.${tip} <small style="opacity:.75">Actualizado ${WX.updated?fmtUpd(WX.updated):''}.</small></span></div>`;
}

      <div class="row">${r.estado!=='aprobado'?`<button class="btn primary small" data-solok="${r.id}">✓ Aprobar</button>`:''}<button class="btn small" data-soled="${r.id}">Editar</button>${r.estado!=='rechazado'?`<button class="btn ghost small" data-solno="${r.id}">Rechazar</button>`:`<button class="btn ghost small" data-solpend="${r.id}">Regresar a pendientes</button>`}${d.correo?`<span class="solm">${d.avisado===r.estado?'✉️ Ya se le avisó por correo':'✉️ Se le avisará por correo en menos de una hora'}</span>`:''}</div></div></article>`;
}
function longDateIso(iso){ const d=new Date(iso+'T00:00'); return isNaN(d)?iso:`${DOWL[d.getDay()]} ${d.getDate()} de ${MESL[d.getMonth()]} de ${d.getFullYear()}`; }
function viewSol(){
  if(!S.user) return `<div class="wrap page"><div class="empty"><b>Inicia sesión</b>Esta sección es solo para las administradoras de Mty Movida.</div></div>`;
  if(!ADMIN) return `<div class="wrap page"><div class="empty"><b>Sin acceso</b>Esta sección es solo para las administradoras de Mty Movida.</div></div>`;
  const tabs={pendiente:'Pendientes',aprobado:'Aprobadas',rechazado:'Rechazadas'};
  return `<div class="wrap page"><div class="phead"><div><span class="script">Solo para ustedes</span><h1>Solicitudes</h1><p>Eventos que mandaron desde «Agrega tu evento». Revísalos, corrígelos si hace falta y apruébalos para que aparezcan en la página. A quien lo mandó le llega un correo solo cuando lo apruebas o lo rechazas.</p></div></div>
    <div class="chips" style="margin-bottom:16px">${Object.entries(tabs).map(([k,n])=>`<button class="chip" data-soltab="${k}" aria-pressed="${SOL.estado===k}">${n}</button>`).join('')}</div>
    ${SOL.error?`<div class="note">No se pudieron leer las solicitudes: ${esc(SOL.error)}</div>`:''}
    ${SOL.lista==null?'<p>Cargando…</p>':!SOL.lista.length?`<div class="empty"><b>${SOL.estado==='pendiente'?'No hay solicitudes nuevas':'No hay nada aquí'}</b>${SOL.estado==='pendiente'?'Cuando alguien mande un evento, aparecerá aquí.':''}</div>`:`<div class="sollist">${SOL.lista.map(solCard).join('')}</div>`}
  </div>`;
}
function bindSol(){
  const q=x=>document.querySelectorAll(x), keep=()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); };
  const cambiar=async(id,estado,datos)=>{ const cambio={estado}; if(datos) cambio.datos=datos;
    const r=await sb.from('eventos_enviados').update(cambio).eq('id',id).select('id'); if(r.error||!r.data||!r.data.length){ toast('No se pudo guardar. Revisa los permisos en Supabase.'); return false; }
    return true; };
  q('[data-soltab]').forEach(b=>b.onclick=async()=>{ SOL.estado=b.dataset.soltab; SOL.lista=null; SOL.editando=null; render(); await cargarSol(); render(); });
  q('[data-solok]').forEach(b=>b.onclick=async()=>{ if(await cambiar(b.dataset.solok,'aprobado')){ toast('Aprobado: ya aparece en la página'); await cargarSol(); loadApproved(); keep(); } });
  q('[data-solno]').forEach(b=>b.onclick=async()=>{ if(await cambiar(b.dataset.solno,'rechazado')){ toast('Rechazado'); await cargarSol(); keep(); } });
  q('[data-solpend]').forEach(b=>b.onclick=async()=>{ if(await cambiar(b.dataset.solpend,'pendiente')){ toast('Regresó a pendientes'); await cargarSol(); keep(); } });
  q('[data-soled]').forEach(b=>b.onclick=()=>{ SOL.editando=b.dataset.soled; keep(); });
  q('[data-solcancel]').forEach(b=>b.onclick=()=>{ SOL.editando=null; keep(); });
  const leer=form=>{ const r=SOL.lista.find(x=>String(x.id)===form.dataset.solform), d={...(r.datos||{})}, fd=new FormData(form);
    for(const [k,v] of fd.entries()) d[k]=k==='precio'?(v===''?null:Number(v)):String(v).trim(); return {r,d}; };
  q('[data-solform]').forEach(form=>form.onsubmit=async ev=>{ ev.preventDefault(); const {r,d}=leer(form); if(await cambiar(r.id,'aprobado',d)){ toast('Guardado y aprobado'); SOL.editando=null; await cargarSol(); loadApproved(); keep(); } });
  q('[data-solsave]').forEach(b=>b.onclick=async()=>{ const form=b.closest('form'), {r,d}=leer(form); if(await cambiar(r.id,r.estado,d)){ toast('Cambios guardados'); SOL.editando=null; await cargarSol(); keep(); } });
}

/* Eventos aprobados en el panel de Supabase (enviados por organizadores o encontrados por el recolector) */
const CAT_OK=k=>CATS[k]?k:'expo';
async function loadApproved(){
  if(!sb) return;
  const { data, error } = await sb.from('eventos_enviados').select('id,datos,foto,fuente').eq('estado','aprobado');
  if(error||!data) return;
  let n=0;
  const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');
  const orgPorNombre=t=>Object.keys(ORGS).find(k=>norm(ORGS[k].n)===norm(t)||norm(ORGS[k].n).startsWith(norm(t))||norm(t).startsWith(norm(ORGS[k].n)));
  data.forEach(r=>{
    const d=r.datos||{}; if(!d.nombre||!/^\d{4}-\d{2}-\d{2}$/.test(d.fecha||'')) return;
    const id='db-'+r.id; if(ev(id)) return;
    const orgName=d.organizador||r.fuente||'Organizador';
    const orgKey=orgPorNombre(orgName)||'org-'+norm(orgName);
    if(!ORGS[orgKey]) ORGS[orgKey]={n:orgName,c:'#7F95E4',d:''};
    let off=offOfDate(new Date(d.fecha+'T00:00')), range=null;
    // Si ya está en la agenda (agregado a mano), no se repite
    const nn=norm(d.nombre), parecido=t=>{ const a=norm(t); return a===nn||(Math.min(a.length,nn.length)>=6&&(a.startsWith(nn)||nn.startsWith(a))); };
    if(EVENTS.some(x=>parecido(x.t)&&(x.off===off||x.range))) return;
    if(d.hasta&&/^\d{4}-\d{2}-\d{2}$/.test(d.hasta)){ const end=offOfDate(new Date(d.hasta+'T00:00')); if(off<0&&end>=0) off=0; const h=new Date(d.hasta+'T00:00'); range=`Hasta el ${h.getDate()} de ${MESL[h.getMonth()]}`; }
    const linea=d.municipio==='linea';
    EVENTS.push({id,t:d.nombre,cat:CAT_OK(d.categoria),org:orgKey,venue:d.lugar||(linea?'En línea':'Por confirmar'),zona:ZONAS[d.municipio]?d.municipio:'centro',
      amb:d.espacio==='exterior'?'exterior':'interior',mod:linea?'linea':'presencial',off,h:/^\d{1,2}:\d{2}/.test(d.hora||'')?d.hora.slice(0,5).padStart(5,'0'):'',
      price:typeof d.precio==='number'?d.precio:null,tags:Array.isArray(d.caracteristicas)?d.caracteristicas:[],going:0,fama:typeof d.fama==='number'?d.fama:0,fechas:Array.isArray(d.funciones)&&d.funciones.length>1?d.funciones.map((f,k)=>({id:k?id+'~'+f.fecha+'T'+(f.hora||''):id,off:offOfDate(new Date(f.fecha+'T00:00')),h:f.hora||''})).filter(f=>f.off>=0&&f.off<=MAXOFF):undefined,desc:d.descripcion||'',range,
      img:r.foto||undefined,url:d.enlace||undefined,src:r.fuente&&r.fuente!=='Organizador'?r.fuente:undefined,credit:d.credito&&d.credito.autor?d.credito:undefined,fit:r.fuente==='Cinemex'?'contain':undefined});
    n++;
  });
  agrupar();
  if(n){ Object.keys(PS).forEach(k=>delete PS[k]); render(); }
}
agrupar();
loadApproved();

(function(){
  const top=document.querySelector('.top'), b=document.getElementById('burger');
  const setMenu=open=>{ top.classList.toggle('menu-open',open); b.setAttribute('aria-expanded',open); b.setAttribute('aria-label',open?'Cerrar menú':'Abrir menú'); };
  b.onclick=e=>{ e.stopPropagation(); setMenu(!top.classList.contains('menu-open')); };
  const grp=document.getElementById('navDesc'), dd=grp&&grp.querySelector('.navdrop');
  if(dd){ dd.onclick=e=>{ e.stopPropagation(); const o=!grp.classList.contains('open'); grp.classList.toggle('open',o); dd.setAttribute('aria-expanded',o); };
    document.addEventListener('click',e=>{ if(!grp.contains(e.target)){ grp.classList.remove('open'); dd.setAttribute('aria-expanded','false'); } }); }
  document.querySelectorAll('#mainNav a').forEach(a=>a.addEventListener('click',()=>setMenu(false)));
  document.addEventListener('click',e=>{ if(top.classList.contains('menu-open')&&!top.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') setMenu(false); });
  window.addEventListener('resize',()=>{ if(window.innerWidth>820) setMenu(false); });
})();
renderUser(); fromHash();
