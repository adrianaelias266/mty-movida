name: Probar envío de eventos
on:
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probar-envio.mjs
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
