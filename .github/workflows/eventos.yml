name: Buscar eventos nuevos

on:
  schedule:
    - cron: '43 7 * * *'    # todos los días a la 1:43 a. m. de Monterrey
  workflow_dispatch:        # permite correrlo a mano desde GitHub
    inputs:
      solo:
        description: 'Revisar solo estas fuentes (separadas por coma). Vacío = todas'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  eventos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar el navegador para las páginas que usan JavaScript
        run: npm install --no-save playwright@1.48.2 && (google-chrome --version || npx playwright install --with-deps chromium)
      - run: node scripts/eventos.mjs
        env:
          SOLO: ${{ github.event.inputs.solo }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
      - name: Fotos libres para los eventos fijos de la página
        run: node scripts/fotos-fijas.mjs
      - name: Guardar fotos encontradas
        run: |
          git config user.name "mty-movida-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/fotos-fijas.json
          git diff --cached --quiet || git commit -m "Fotos libres para eventos de la agenda"
          git pull --rebase -q && git push
