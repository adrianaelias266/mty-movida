name: Fotos de Mapillary para atracciones
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fotos-mapillary.mjs
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      - run: |
          git config user.name "mty-movida-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/img/atr public/data/fotos-mapillary.json
          git diff --cached --quiet || git commit -m "Fotos de Mapillary para atracciones"
          git pull --rebase -q && git push
