name: Sondeo de páginas
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Direcciones separadas por espacio'
        required: true
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sondeo.mjs
        env:
          URLS: ${{ github.event.inputs.urls }}
