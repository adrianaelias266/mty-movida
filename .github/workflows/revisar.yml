name: Revisar página publicada
on:
  workflow_dispatch:
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/revisar.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: revision-*.png
