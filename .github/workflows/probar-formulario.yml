name: Probar formulario de eventos
on:
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/probar-formulario.mjs
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
